name: Monocle
options:
  bundleIdPrefix: com.farchan
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.7'
    CURRENT_PROJECT_VERSION: '23'
targets:
  Monocle:
    type: application
    platform: iOS
    sources: [Monocle]
    info:
      path: Monocle/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.monocle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: monocle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your spending records.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MonocleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MonocleTests]
    dependencies:
      - target: Monocle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MonocleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MonocleUITests]
    dependencies:
      - target: Monocle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Monocle:
    build:
      targets:
        Monocle: all
    test:
      targets: [MonocleTests, MonocleUITests]
