name: Anka
options:
  bundleIdPrefix: com.farchan
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.9.9'
    CURRENT_PROJECT_VERSION: '113'
    ANKA_RUN_LARGE_BENCHMARK: '0'
targets:
  Anka:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources: [Anka]
    info:
      path: Anka/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # ProMotion: without this, iPhone caps the app's own animations and drags at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.farchan.anka.backup
            UTTypeDescription: Anka workspace backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ankabackup, monoclebackup]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.anka
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: anka
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your spending records.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Anka/Resources/Anka.entitlements
    dependencies:
      - target: AnkaWidgets
  AnkaWidgets:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: AnkaWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Anka/Integrations/Widgets/WidgetSnapshot.swift
      - path: Anka/Integrations/Widgets/WidgetSnapshotStore.swift
    info:
      path: AnkaWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.anka.AnkaWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: AnkaWidgets/AnkaWidgets.entitlements
  AnkaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AnkaTests
      - path: Configuration/Anka.storekit
        buildPhase: resources
    dependencies:
      - target: Anka
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnkaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AnkaUITests]
    dependencies:
      - target: Anka
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnkaMac:
    type: application
    platform: macOS
    sources:
      - path: Anka/Domain
      - path: Anka/Application
      - path: Anka/Persistence
      - path: Anka/App/AppModel.swift
      - path: Anka/App/AppEnvironment.swift
      - path: Anka/Integrations/ExpenseIntents.swift
      - path: Anka/Integrations/BillNotificationService.swift
      - path: Anka/Resources/Anka.xcdatamodeld
      - path: Anka/Resources/PrivacyInfo.xcprivacy
      - path: Anka/Features/Chat/ChatBubble.swift
      - path: Anka/Features/Chat/ProgressiveBlur.swift
      - path: Anka/Features/Chat/ChatTranscript.swift
      - path: Anka/Features/Chat/ExpenseProposalCard.swift
      - path: Anka/Features/Chat/ChatChartView.swift
      - path: Anka/Features/StockDesignViews.swift
      - path: Anka/Features/BudgetStatusViews.swift
      - path: AnkaMac
    info:
      path: AnkaMac/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: anka
        LSApplicationCategoryType: public.app-category.finance
        NSHumanReadableCopyright: Copyright © 2026 Farchan. All rights reserved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.anka.mac
        PRODUCT_NAME: Anka
        PRODUCT_MODULE_NAME: AnkaMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: AnkaMac/Resources/AnkaMac.entitlements
        MACOSX_DEPLOYMENT_TARGET: '26.0'
        ENABLE_HARDENED_RUNTIME: YES
  AnkaMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AnkaMacTests]
    dependencies:
      - target: AnkaMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: '26.0'
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Anka.app/Contents/MacOS/Anka
        BUNDLE_LOADER: $(TEST_HOST)
  AnkaMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [AnkaMacUITests]
    dependencies:
      - target: AnkaMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: '26.0'
schemes:
  Anka:
    build:
      targets:
        Anka: all
        AnkaWidgets: all
    run:
      storeKitConfiguration: Configuration/Anka.storekit
    test:
      targets: [AnkaTests, AnkaUITests]
      environmentVariables:
        ANKA_RUN_LARGE_BENCHMARK: $(ANKA_RUN_LARGE_BENCHMARK)
  AnkaMac:
    build:
      targets:
        AnkaMac: all
    test:
      targets: [AnkaMacTests, AnkaMacUITests]
