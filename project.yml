name: Monocle
options:
  bundleIdPrefix: com.farchan
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.8.5'
    CURRENT_PROJECT_VERSION: '100'
    MONOCLE_RUN_LARGE_BENCHMARK: '0'
targets:
  Monocle:
    type: application
    platform: iOS
    sources: [Monocle]
    info:
      path: Monocle/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.farchan.monocle.backup
            UTTypeDescription: Monocle workspace backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [monoclebackup]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.monocle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: monocle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your spending records.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Monocle/Resources/Monocle.entitlements
    dependencies:
      - target: MonocleWidgets
  MonocleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MonocleWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Monocle/Integrations/Widgets/WidgetSnapshot.swift
      - path: Monocle/Integrations/Widgets/WidgetSnapshotStore.swift
    info:
      path: MonocleWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.monocle.MonocleWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: MonocleWidgets/MonocleWidgets.entitlements
  MonocleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MonocleTests]
    dependencies:
      - target: Monocle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MonocleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MonocleUITests]
    dependencies:
      - target: Monocle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MonocleMac:
    type: application
    platform: macOS
    sources:
      - path: Monocle/Domain
      - path: Monocle/Application
      - path: Monocle/Persistence
      - path: Monocle/App/AppModel.swift
      - path: Monocle/App/AppEnvironment.swift
      - path: Monocle/Integrations/ExpenseIntents.swift
      - path: Monocle/Integrations/BillNotificationService.swift
      - path: Monocle/Resources/Monocle.xcdatamodeld
      - path: Monocle/Features/Chat/ChatBubble.swift
      - path: Monocle/Features/Chat/ProgressiveBlur.swift
      - path: Monocle/Features/Chat/ChatTranscript.swift
      - path: Monocle/Features/Chat/ExpenseProposalCard.swift
      - path: Monocle/Features/Chat/ChatChartView.swift
      - path: Monocle/Features/StockDesignViews.swift
      - path: Monocle/Features/BudgetStatusViews.swift
      - path: MonocleMac
    info:
      path: MonocleMac/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: monocle
        LSApplicationCategoryType: public.app-category.finance
        NSHumanReadableCopyright: Copyright © 2026 Farchan. All rights reserved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.monocle.mac
        PRODUCT_NAME: Monocle
        PRODUCT_MODULE_NAME: MonocleMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: MonocleMac/Resources/MonocleMac.entitlements
        MACOSX_DEPLOYMENT_TARGET: '26.0'
        ENABLE_HARDENED_RUNTIME: YES
  MonocleMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MonocleMacTests]
    dependencies:
      - target: MonocleMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: '26.0'
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Monocle.app/Contents/MacOS/Monocle
        BUNDLE_LOADER: $(TEST_HOST)
  MonocleMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MonocleMacUITests]
    dependencies:
      - target: MonocleMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: '26.0'
schemes:
  Monocle:
    build:
      targets:
        Monocle: all
        MonocleWidgets: all
    test:
      targets: [MonocleTests, MonocleUITests]
      environmentVariables:
        MONOCLE_RUN_LARGE_BENCHMARK: $(MONOCLE_RUN_LARGE_BENCHMARK)
  MonocleMac:
    build:
      targets:
        MonocleMac: all
    test:
      targets: [MonocleMacTests, MonocleMacUITests]
