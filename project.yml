name: Monocle
options:
  bundleIdPrefix: com.farchan
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.7.0'
    CURRENT_PROJECT_VERSION: '59'
targets:
  Monocle:
    type: application
    platform: iOS
    sources: [Monocle]
    info:
      path: Monocle/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.monocle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: monocle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your spending records.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Monocle/Resources/Monocle.entitlements
    dependencies:
      - target: MonocleWidgets
  MonocleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MonocleWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Monocle/Integrations/Widgets/WidgetSnapshot.swift
      - path: Monocle/Integrations/Widgets/WidgetSnapshotStore.swift
    info:
      path: MonocleWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.monocle.MonocleWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: MonocleWidgets/MonocleWidgets.entitlements
  MonocleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MonocleTests]
    dependencies:
      - target: Monocle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MonocleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MonocleUITests]
    dependencies:
      - target: Monocle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Monocle:
    build:
      targets:
        Monocle: all
        MonocleWidgets: all
    test:
      targets: [MonocleTests, MonocleUITests]
