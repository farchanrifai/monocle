name: Ankka
options:
  bundleIdPrefix: com.farchan
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.9.9'
    CURRENT_PROJECT_VERSION: '113'
    ANKKA_RUN_LARGE_BENCHMARK: '0'
targets:
  Ankka:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources: [Ankka]
    info:
      path: Ankka/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # ProMotion: without this, iPhone caps the app's own animations and drags at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.farchan.ankka.backup
            UTTypeDescription: Ankka workspace backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ankkabackup, ankabackup, monoclebackup]
        # ankka:// links from widgets, Shortcuts and Safari (AnkkaApp.onOpenURL).
        CFBundleURLTypes:
          - CFBundleURLName: com.farchan.ankka
            CFBundleURLSchemes: [ankka]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.ankka
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ankka
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your spending records.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Ankka/Resources/Ankka.entitlements
    dependencies:
      - target: AnkkaWidgets
  AnkkaWidgets:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: AnkkaWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Ankka/Integrations/Widgets/WidgetSnapshot.swift
      - path: Ankka/Integrations/Widgets/WidgetSnapshotStore.swift
    info:
      path: AnkkaWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.ankka.AnkkaWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: AnkkaWidgets/AnkkaWidgets.entitlements
  AnkkaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AnkkaTests
      - path: Configuration/Ankka.storekit
        buildPhase: resources
    dependencies:
      - target: Ankka
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnkkaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AnkkaUITests]
    dependencies:
      - target: Ankka
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnkkaMac:
    type: application
    platform: macOS
    sources:
      - path: Ankka/Domain
      - path: Ankka/Application
      - path: Ankka/Persistence
      - path: Ankka/App/AppModel.swift
      - path: Ankka/App/AppEnvironment.swift
      - path: Ankka/Integrations/ExpenseIntents.swift
      - path: Ankka/Integrations/BillNotificationService.swift
      - path: Ankka/Resources/Ankka.xcdatamodeld
      - path: Ankka/Resources/PrivacyInfo.xcprivacy
      - path: Ankka/Features/Chat/ChatBubble.swift
      - path: Ankka/Features/Chat/ProgressiveBlur.swift
      - path: Ankka/Features/Chat/ChatTranscript.swift
      - path: Ankka/Features/Chat/ExpenseProposalCard.swift
      - path: Ankka/Features/Chat/ChatChartView.swift
      - path: Ankka/Features/StockDesignViews.swift
      - path: Ankka/Features/BudgetStatusViews.swift
      - path: AnkkaMac
    info:
      path: AnkkaMac/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ankka
        LSApplicationCategoryType: public.app-category.finance
        NSHumanReadableCopyright: Copyright © 2026 Farchan. All rights reserved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farchan.ankka.mac
        PRODUCT_NAME: Ankka
        PRODUCT_MODULE_NAME: AnkkaMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: AnkkaMac/Resources/AnkkaMac.entitlements
        MACOSX_DEPLOYMENT_TARGET: '26.0'
        ENABLE_HARDENED_RUNTIME: YES
  AnkkaMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AnkkaMacTests]
    dependencies:
      - target: AnkkaMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: '26.0'
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ankka.app/Contents/MacOS/Ankka
        BUNDLE_LOADER: $(TEST_HOST)
  AnkkaMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [AnkkaMacUITests]
    dependencies:
      - target: AnkkaMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: '26.0'
schemes:
  Ankka:
    build:
      targets:
        Ankka: all
        AnkkaWidgets: all
    run:
      storeKitConfiguration: Configuration/Ankka.storekit
    test:
      targets: [AnkkaTests, AnkkaUITests]
      environmentVariables:
        ANKKA_RUN_LARGE_BENCHMARK: $(ANKKA_RUN_LARGE_BENCHMARK)
  AnkkaMac:
    build:
      targets:
        AnkkaMac: all
    test:
      targets: [AnkkaMacTests, AnkkaMacUITests]
